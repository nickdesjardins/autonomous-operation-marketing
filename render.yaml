# Render Blueprint: one free web service that serves the API and its playground at "/".
#
# Render reads this file when you choose New > Blueprint and pick this repository, so the only
# values typed into a form are the OpenRouter key and the database string. docs/DEPLOY.md walks
# through it step by step. The webhook secret is generated by Render; the service posts every
# approved listing to its own receiver, so the public demo never calls out.
services:
  - type: web
    name: multi-agent-ops-pipeline
    runtime: python # the Python version comes from the .python-version file
    plan: free # without this line Render creates a paid instance
    region: virginia # same coast as a Neon database in us-east-1; cannot be changed later
    buildCommand: pip install -r requirements.txt
    # One process on purpose: the demo budget and the model chooser live in its memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    # Liveness only. Render probes this path every few seconds; /health would query Neon on
    # each probe and keep its compute awake around the clock, past the free monthly allowance.
    healthCheckPath: /livez
    autoDeployTrigger: commit # every push to main is built and deployed
    buildFilter:
      ignoredPaths: # a push that changes only these does not rebuild the service
        - site/**
        - docs/**
        - README.md
        - .github/**
        - tests/**
        - scripts/**
        - benchmarks/**
    envVars:
      - key: ENVIRONMENT
        value: production # hides /docs
      - key: DEMO_MODE
        value: "true" # runs budgeted, revisions capped, webhook kept inside the service
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false # asked for once, when the Blueprint is created; never stored here
      - key: DATABASE_URL
        sync: false # paste Neon's DATABASE_URL_UNPOOLED (the direct connection string)
      - key: WEBHOOK_TARGET
        value: self # the service's own HMAC-verified receiver
      - key: WEBHOOK_SECRET
        generateValue: true # the HMAC key; generated by Render, read it in the dashboard
      - key: CORS_ALLOW_ORIGINS
        value: https://nickdesjardins.github.io # the project page on GitHub Pages
      # Visitor addresses, for the per-visitor limits. Render's traffic passes through
      # Cloudflare, which overwrites CF-Connecting-IP with the real address.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Public run budget (OpenRouter allows 20 free requests a minute; with DEMO_MAX_REVISIONS=2
      # a run is 2 to 4 calls, and the budget reserves 6 for it).
      - key: DEMO_MAX_REVISIONS
        value: "2"
      - key: RUN_RATE_LIMIT_PER_MINUTE
        value: "2"
      - key: RUN_DAILY_LIMIT_PER_CLIENT
        value: "12"
      - key: RUN_GLOBAL_LIMIT_PER_MINUTE
        value: "6"
      - key: RUN_DAILY_LIMIT
        value: "120"
      - key: RUN_MAX_INFLIGHT
        value: "2"
      - key: OPENROUTER_ALLOWANCE_RESERVE
        value: "100"
      - key: DB_POOL_MIN_SIZE
        value: "1" # Neon's free compute is small; the service runs one worker
      - key: DB_POOL_MAX_SIZE
        value: "4"
      - key: DB_STARTUP_RETRIES
        value: "3" # Neon may take a few seconds to resume after suspending
      - key: LOG_LEVEL
        value: INFO
