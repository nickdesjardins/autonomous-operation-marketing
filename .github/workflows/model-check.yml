# Keeps a tested model chain published, so that a service which slept for weeks wakes up on
# models that work. Three small jobs, once a day.
#
#   test     Decides whether a test of the free models is due: nothing is published yet, the
#            last test is about a week old, the last test could confirm nothing, or
#            OpenRouter's list of free models is not the one the last test saw. Deciding costs
#            nothing and needs no key. The test itself is the service's own
#            (app/models/testing.py): the three cases of app/models/cases.py per model, one
#            synthesis and two audits of the sample SKU. It needs the repository secret
#            OPENROUTER_API_KEY and spends free requests from that account: 12 at the very
#            most (4 models x 3 cases). Without the secret this job only says what is due.
#
#   publish  Writes the tested chain to chain.json on the branch "tested-models". A service
#            reads that file when it starts (app/models/published.py). The branch is not
#            "main" on purpose: a host that deploys on every push to main would restart the
#            service at every publication.
#
#   verdict  Turns the run red when the owner has something to do. GitHub emails the person
#            who last changed the schedule about a failed scheduled run.
#
# Why testing and publishing are two jobs: the job that holds the OpenRouter key and runs
# downloaded Python packages may only read this repository. The job that may write to it runs
# nothing but git and a few lines of standard-library Python.
#
# When this run is red, the owner has something to do. The step "Decide, test, and write the
# file to publish" of the job "test" ends with a line that begins "Failing this run on
# purpose:" and says which of these it is:
#   * a test ran, or could not run, and no chain younger than three weeks is published
#     (services are on their own);
#   * OpenRouter refused the key;
#   * there is no key, and a model of the built-in default chain is no longer listed;
#   * OpenRouter no longer offers any model of the chain, and no other model passed;
#   * a model of the chain failed the test. The chain is published all the same, and only a
#     person can change its order (README, "Model selection").
# A red run without such a line means that the job itself broke: a step before the test
# failed, or the command ended with a Python traceback.
#
# What this cannot do:
#   * GitHub pauses scheduled workflows in a public repository after 60 days without
#     repository activity, and does not say whether a push to "tested-models" counts. Assume
#     it does not. To bring it back: Actions tab, "Model check", "Enable workflow" (or
#     "gh workflow enable model-check.yml"). A paused workflow is not started by a push either.
#   * It serves services that leave OPENROUTER_MODELS blank. A chain you name yourself is
#     neither tested nor replaced.
name: Model check

on:
  schedule:
    # Daily at 06:17 UTC. Off the hour on purpose: GitHub delays jobs queued at :00.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Test the free models now, even if no test is due"
        type: boolean
        default: false
  push:
    branches: [main]
    # Everything a test result depends on. When a change here changes the test itself (a
    # prompt, a schema, a case, the compliance checks, the rules, the default chain), the
    # published list was "made by other code", and a new one is tested at once.
    paths:
      - app/config.py
      - app/schemas.py
      - app/graph/prompts.py
      - app/compliance/rules.py
      - app/seed.py
      - app/models/cache.py
      - app/models/cases.py
      - app/models/catalogue.py
      - app/models/rules.py
      - app/models/testing.py
      - app/models/chooser.py
      - app/models/published.py
      - app/services/llm_client.py
      - requirements.txt
      - .github/workflows/model-check.yml

# Read-only, unless a job says otherwise.
permissions:
  contents: read

# One run at a time. One more may wait; a newer waiting run replaces an older one, which is
# fine here: every run decides afresh what is due.
concurrency:
  group: model-check
  cancel-in-progress: false

jobs:
  test:
    name: Test the free models, if a test is due
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      file: ${{ steps.test.outputs.file }}
      status: ${{ steps.test.outputs.status }}
    steps:
      # The token this job gets can only read (see "permissions" above), so it does no harm
      # that the checkout keeps it for the fetch two steps down.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The same file tells the host which Python to run the service on.
          python-version-file: .python-version
          cache: pip
      - name: Install the service's requirements
        run: pip install -r requirements.txt
      - name: Fetch what was published last time
        # Straight from the branch, not from raw.githubusercontent.com, which may hand out a
        # copy that is up to five minutes old.
        run: |
          mkdir -p previous
          # Ask first whether the branch is there. "No such branch" (status 2) and "could
          # not ask" must not look alike: the second would otherwise start a full test, as
          # if nothing had ever been published.
          found=0
          git ls-remote --exit-code --heads origin tested-models > /dev/null || found=$?
          if [ "$found" = 2 ]; then
            echo "Nothing has been published yet."
          elif [ "$found" != 0 ]; then
            echo "::error::The branch tested-models could not be asked for (git ls-remote ended with $found)."
            exit 1
          else
            git fetch --quiet --depth=1 origin tested-models
            # A branch without the file (one made by hand, say) is "nothing usable is
            # published": the test then runs, and "publish" puts the file there.
            git show FETCH_HEAD:chain.json > previous/chain.json || rm -f previous/chain.json
          fi
      - name: Decide, test, and write the file to publish
        id: test
        env:
          # Only this step sees the key. Without the secret this is an empty string, and the
          # command then says what is due and tests nothing.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The job never opens a database and never reads a published list of its own.
          CHECKPOINTER: memory
          MODEL_PUBLISHED_URL: "null"
          FORCE: ${{ inputs.force }}
        run: |
          force=""
          if [ "$FORCE" = "true" ]; then force="--force"; fi
          status=0
          python -m app.models.published --previous previous/chain.json --out out/chain.json $force || status=$?
          # This step stays green either way, so that what it wrote can still be published.
          # The "verdict" job below turns the run red when status is not 0.
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f out/chain.json ]; then
            # Handed to the next job as one line of text. It holds model ids, dates and
            # timings, and no secret.
            echo "file=$(base64 --wrap=0 out/chain.json)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish the tested chain
    needs: test
    # Only what the main branch tested is published. A run started by hand on another branch
    # tests that branch's code, and no deployment of main would accept its list.
    if: needs.test.outputs.file != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Write chain.json to the tested-models branch
        env:
          FILE: ${{ needs.test.outputs.file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$FILE" | base64 --decode > new-chain.json

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet branch
          cd branch
          if git fetch --quiet --depth=1 "$remote" tested-models; then
            git checkout --quiet -b tested-models FETCH_HEAD
          else
            # The first time: a branch with no history in common with the code.
            git checkout --quiet --orphan tested-models
            printf '%s\n' \
              "This branch is written by the scheduled job in .github/workflows/model-check.yml." \
              "chain.json holds the model chain its last test confirmed. Do not edit it by hand:" \
              "the next run replaces it. See the README on the main branch, 'The scheduled test'." \
              > README.md
            git add README.md
          fi

          # The job that made this file ran downloaded packages. Look at it once more here,
          # with the runner's own Python: small, free models only, and nothing a service
          # would refuse (app/models/published.py makes the same checks, and a test holds
          # these lines to its numbers). The same lines say what changed, for the commit
          # message.
          message=$(python3 - <<'PY'
          import json, os, re, sys
          free = re.compile(r"[a-z0-9][a-z0-9._-]{0,63}/[a-z0-9][a-z0-9._-]{0,95}:free")
          stamp = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z")
          new = json.load(open("../new-chain.json", encoding="utf-8"))
          chain = new.get("chain") if isinstance(new, dict) else None
          ok = (
              isinstance(new, dict)
              and os.path.getsize("../new-chain.json") <= 64_000
              and new.get("version") == 2
              and isinstance(new.get("tested"), str)
              and stamp.fullmatch(new["tested"])
              and isinstance(chain, list)
              and 1 <= len(chain) <= 3
              and all(isinstance(model, str) and free.fullmatch(model) for model in chain)
              and len(set(chain)) == len(chain)
          )
          if not ok:
              sys.exit("chain.json is not a small file with a dated chain of free model ids")
          try:
              old = json.load(open("chain.json", encoding="utf-8")).get("chain")
          except (OSError, ValueError, AttributeError):
              old = None
          day = str(new.get("tested", ""))[:10]
          job = new.get("job") if isinstance(new.get("job"), dict) else {}
          short = lambda models: ", ".join(str(m).split("/")[-1].split(":")[0] for m in models)
          if job.get("outcome") == "nothing":
              # The chain and its date stay; only "a test ran" is written down.
              checked = str(job.get("checked", ""))[:10]
              print(f"Test of {checked} confirmed nothing: the chain of {day} stays ({short(chain)})")
          elif old == chain:
              print(f"Tested chain {day}: unchanged ({short(chain)})")
          elif isinstance(old, list):
              print(f"Tested chain {day}: {short(chain)} (was: {short(old)})")
          else:
              print(f"Tested chain {day}: {short(chain)}")
          PY
          )

          mv ../new-chain.json chain.json
          git add chain.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "$message"
          git push --quiet "$remote" tested-models
          echo "$message. Services read it from" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/tested-models/chain.json" \
            >> "$GITHUB_STEP_SUMMARY"

  verdict:
    name: Is a tested chain published?
    needs: [test, publish]
    # Runs although "publish" may have been skipped; fails the run when the command in "test"
    # ended with an error, or never ran. Its own log lines say where to look.
    if: ${{ !cancelled() && needs.test.outputs.status != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The owner has something to do
        run: |
          echo "The job 'Test the free models, if a test is due' did not end well."
          echo "Open it and read the end of its step 'Decide, test, and write the file to publish'."
          echo "A line that begins 'Failing this run on purpose:' says what you can do."
          echo "Without such a line the job itself broke: an earlier step failed, or the"
          echo "command ended with a Python traceback."
          exit 1
